# Software decoding only.  Hardware decoding has produced black video here with
# audio and subtitles still working, on the Rembrandt 680M: direct VAAPI
# (dmabuf import) and, more recently, vaapi-copy both did it in the "balanced"
# power profile even though the same playback is fine in "performance".
# Software decode always displays correctly; measured on 1080p H.264, ~18% CPU
# vs ~10% with vaapi-copy and ~5% with direct vaapi.  Do not re-enable hwdec
# without testing video output in balanced mode.
#
# Before blaming the decoder, check for a stale resume entry: mpv stores stream
# selection in ~/.local/state/mpv/watch_later/ and a saved "vid=no" makes the
# next launch play audio with no picture at all.  Find them with:
#   grep -l 'vid=no' ~/.local/state/mpv/watch_later/*
hwdec=no

sub-visibility=yes
sub-auto=fuzzy
alang=jpn, jp, en
slang=jpn, jp, en
audio-file-auto=fuzzy
save-position-on-quit=yes
autofit-larger=100%x100%
geometry=50%:50%
sub-font-size=55
# ao=alsa
# Automatically use external subtitle files that contain the name of the media file
sub-auto=fuzzy
demuxer-readahead-secs=3
sub-ass-override=yes
sub-font="Noto Sans CJK JP Regular"

# Screenshots
screenshot-directory="~/Pictures/Screenshots/"
screenshot-template="%F_%wHh%wMm%wSs%wTms"
screenshot-format=jpg
screenshot-jpeg-quality=90
screenshot-high-bit-depth=yes

ytdl-raw-options=sub-lang="ja",write-sub=,write-auto-sub=
ytdl-format=bestvideo[height<=?1080]+bestaudio/best
